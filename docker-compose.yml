# =========================================================
# TradeOwl — LOCAL DEV infrastructure (Postgres only)
# =========================================================
# 목적: 로컬에서 백엔드/프론트를 IDE·Gradle·npm으로 직접 실행하고,
#       그 앱이 붙을 DB만 컨테이너로 띄운다.
#   기동:  docker compose up -d
#   중지:  docker compose down        (데이터 유지)
#   초기화: docker compose down -v      (볼륨까지 삭제)
#
# 프로덕션 풀스택(nginx+app+db+redis)은 docker-compose.prod.yml 참조.
# 여기 자격증명은 로컬 전용 더미이며 커밋해도 무방하다(운영에 절대 재사용 금지).
# 포트는 127.0.0.1에만 바인딩하여 네트워크 노출을 막는다.

services:
  db:
    image: postgres:16-alpine
    container_name: tradeowl-db-dev
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_DB=tradeowl
      - POSTGRES_USER=tradeowl
      - POSTGRES_PASSWORD=tradeowl_local_dev
      - TZ=Asia/Seoul
    volumes:
      - tradeowl_pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradeowl -d tradeowl"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  tradeowl_pgdata_dev:
