spring:
  application:
    name: coinvest
  profiles:
    active: local   # 로컬 기본값. 배포는 SPRING_PROFILES_ACTIVE=prod 로 오버라이드(env가 우선)
  jpa:
    hibernate:
      ddl-auto: validate   # 스키마 변경은 Flyway로만. 엔티티/스키마 불일치 조기 발견
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.coinvest: INFO
