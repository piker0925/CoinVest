# =========================================================
# TradeOwl — PRODUCTION full stack (nginx + app + frontend + db)
# =========================================================
# 로컬 개발엔 쓰지 않는다 (로컬은 docker-compose.yml = 인프라만).
# 배포 파이프라인은 이 내용을 GitHub Secret(DOCKER_COMPOSE_CONTENT)으로 주입한다.
#
# ⚠️ 배포(하드닝) Phase 전에 반드시 고칠 것 (docs/audit 참조):
#   - db(5432) 호스트 공개 바인딩 제거 또는 127.0.0.1 한정 (P0-12)
#   - TLS 종단 + backend healthcheck (P1-30)
# (redis/kafka는 스택에서 제거됨 — P0-12 redis·P2-37 kafka 항목 해소)

services:
  nginx:
    image: nginx:stable-alpine
    container_name: tradeowl-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    environment:
      - TZ=Asia/Seoul
    networks:
      - tradeowl-network
    restart: always

  frontend:
    image: ${DOCKERHUB_USERNAME}/tradeowl-frontend:latest
    container_name: tradeowl-frontend
    expose:
      - "3000"
    deploy:
      resources:
        limits:
          memory: 300M
    env_file:
      - .env
    environment:
      - TZ=Asia/Seoul
    depends_on:
      - backend
    networks:
      - tradeowl-network
    restart: always

  backend:
    image: ${DOCKERHUB_USERNAME}/tradeowl-app:latest
    container_name: tradeowl-app
    expose:
      - "8080"
    deploy:
      resources:
        limits:
          memory: 450M
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${DB_NAME:-tradeowl}
      - SPRING_DATASOURCE_USERNAME=${DB_USER:-tradeowl}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASS}
      - JAVA_OPTS=-Xmx256m -Xms256m
      - TZ=Asia/Seoul
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tradeowl-network
    restart: always

  db:
    image: postgres:16-alpine
    container_name: tradeowl-db
    ports:
      - "5432:5432"
    deploy:
      resources:
        limits:
          memory: 150M
    environment:
      - POSTGRES_DB=${DB_NAME:-tradeowl}
      - POSTGRES_USER=${DB_USER:-tradeowl}
      - POSTGRES_PASSWORD=${DB_PASS}
      - TZ=Asia/Seoul
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-tradeowl} -d ${DB_NAME:-tradeowl}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - tradeowl-network
    restart: always

networks:
  tradeowl-network:
    driver: bridge

volumes:
  postgres_data:
